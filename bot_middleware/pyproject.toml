[project]
name = "bot-middleware"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amit Singh", email = "asingh66@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "microsoft-agents-authentication-msal>=1.8.0",
    "microsoft-agents-hosting-fastapi>=1.8.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
bot-middleware = "bot_middleware:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
